<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Языки</title>
</head>
<body>
    <script>
        const lang = prompt('Ввыедите желаемый язык перевода(en, ru, de):');
        switch (lang){
            case 'de':
                console.log('Guten tag!');
                break;
            case 'en': 
                console.log('Hello!');
                break;
            case 'ru':
                console.log('Привет!');
                break;
            default:
                console.log('Увы, такого языка мы не знаем.');
        }
    </script>
</body>
</html>
